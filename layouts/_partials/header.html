<header class="site-header gec-site-header">
    <div class="nav-container gec-nav-container" id="gec-nav-container">
        <a class="site-logo gec-brand gec-brand-logo-link" href="{{ site.Home.RelPermalink }}" aria-label="Gaming Evolution Centre home">
            <img
                class="gec-brand-image"
                src="{{ "images/gec-logo.webp" | relURL }}?v=4a0d57b3d66f5b6ba2b82e4a40466a8d2a878368"
                alt=""
                aria-hidden="true"
                width="348"
                height="35"
            >
        </a>

        {{ partial "search.html" . }}

        <nav class="main-nav gec-main-nav" id="main-navigation" aria-label="Main navigation">
            <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} class="is-active" aria-current="page"{{ end }}>Home</a>
            <a href="/posts/"{{ if eq .Section "posts" }} class="is-active" aria-current="page"{{ end }}>Articles</a>
            <a href="/downloads/"{{ if eq .Section "downloads" }} class="is-active" aria-current="page"{{ end }}>Downloads</a>
            <a href="/support/"{{ if eq .RelPermalink ("/support/" | relURL) }} class="is-active" aria-current="page"{{ end }}>Support</a>
        </nav>

        <div class="gec-header-actions">
            <button
                type="button"
                class="mobile-search-button gec-icon-button"
                id="mobile-search-button"
                aria-label="Open search"
                aria-controls="site-search"
                aria-expanded="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                    <path d="M16 16L21 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                </svg>
                <span class="sr-only">Search</span>
            </button>

            <button
                type="button"
                class="theme-toggle gec-icon-button"
                id="theme-toggle"
                aria-label="Switch to light mode"
                aria-pressed="false"
                title="Dark mode"
            >
                <svg class="theme-toggle-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                    <g class="theme-icon-sun">
                        <circle cx="12" cy="12" r="4.25"></circle>
                        <path d="M12 2V4"></path>
                        <path d="M12 20V22"></path>
                        <path d="M2 12H4"></path>
                        <path d="M20 12H22"></path>
                        <path d="M4.93 4.93L6.34 6.34"></path>
                        <path d="M17.66 17.66L19.07 19.07"></path>
                        <path d="M17.66 6.34L19.07 4.93"></path>
                        <path d="M4.93 19.07L6.34 17.66"></path>
                    </g>
                    <g class="theme-icon-moon">
                        <path d="M20.25 15.25A8.5 8.5 0 0 1 8.75 3.75 8.5 8.5 0 1 0 20.25 15.25Z"></path>
                    </g>
                </svg>
                <span class="sr-only">Toggle colour theme</span>
            </button>

            <button
                class="mobile-menu-button"
                id="mobile-menu-button"
                type="button"
                aria-label="Open navigation"
                aria-controls="main-navigation"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
</header>
