<header class="site-header" data-pagefind-ignore="all">

    <div class="nav-container">

        <a
            class="site-logo"
            href="{{ site.Home.RelPermalink }}"
        >
            Gaming Evolution Centre
        </a>


        <!--
            Visual search bar.
            The existing Pagefind search JavaScript already listens
            for #search-open, so this opens the same advanced search.
        -->
        <button
            type="button"
            class="header-search-bar"
            id="search-open"
            aria-label="Open search"
            aria-haspopup="dialog"
            aria-controls="search-overlay"
        >
            <span class="header-search-placeholder">
                Search...
            </span>

            <svg
                class="header-search-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
            >
                <circle
                    cx="11"
                    cy="11"
                    r="6.5"
                ></circle>

                <path
                    d="M16 16L21 21"
                ></path>
            </svg>
        </button>


        <button
            class="mobile-menu-button"
            id="mobile-menu-button"
            type="button"
            aria-label="Open navigation"
            aria-controls="main-navigation"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <nav
            class="main-nav"
            id="main-navigation"
            aria-label="Main navigation"
        >

            {{ range site.Menus.main }}

                {{ $active := false }}

                {{ if $.IsMenuCurrent "main" . }}
                    {{ $active = true }}
                {{ else if $.HasMenuCurrent "main" . }}
                    {{ $active = true }}
                {{ end }}

                <a
                    href="{{ .URL }}"
                    {{ if $active }}
                        class="active"
                        aria-current="page"
                    {{ end }}
                >
                    {{ .Name }}
                </a>

            {{ end }}


            <!--
                Light bulb:
                OFF = grey mode
                ON  = white mode
            -->
            <button
                type="button"
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Turn light mode on"
                aria-pressed="false"
                title="Light mode off"
            >
                <svg
                    class="theme-toggle-icon"
                    viewBox="0 0 24 24"
                    width="22"
                    height="22"
                    aria-hidden="true"
                    focusable="false"
                >
                    <g class="bulb-rays">
                        <path d="M12 1.5V4"></path>
                        <path d="M4.6 4.6L6.4 6.4"></path>
                        <path d="M1.5 12H4"></path>
                        <path d="M20 12H22.5"></path>
                        <path d="M17.6 6.4L19.4 4.6"></path>
                    </g>

                    <path
                        class="bulb-glass"
                        d="M12 5.25
                           C8.55 5.25 5.75 7.96 5.75 11.3
                           C5.75 13.5 6.92 15.34 8.72 16.58
                           C9.28 16.97 9.62 17.55 9.67 18.2
                           H14.33
                           C14.38 17.55 14.72 16.97 15.28 16.58
                           C17.08 15.34 18.25 13.5 18.25 11.3
                           C18.25 7.96 15.45 5.25 12 5.25Z"
                    ></path>

                    <path d="M9.5 20H14.5"></path>
                    <path d="M10.5 22H13.5"></path>
                </svg>

                <span class="sr-only">
                    Toggle light mode
                </span>
            </button>

        </nav>

    </div>

</header>
