<header class="site-header gec-site-header">
    <div class="nav-container gec-nav-container">
        <a class="site-logo gec-brand gec-brand-logo-link" href="{{ site.Home.RelPermalink }}" aria-label="Gaming Evolution Centre home">
            <img
                class="gec-brand-image"
                src="{{ "images/gec-logo.webp" | relURL }}"
                alt="Gaming Evolution Centre"
                width="420"
                height="89"
            >
        </a>

        <button
            class="mobile-menu-button"
            id="mobile-menu-button"
            type="button"
            aria-label="Open navigation"
            aria-controls="main-navigation"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="main-nav gec-main-nav" id="main-navigation" aria-label="Main navigation">
            <a href="/posts/">Articles</a>
            <a href="/downloads/">Downloads</a>
            <a href="/forums/">Forums</a>
            <a href="https://www.twitch.tv/gamingevolutioncentre" target="_blank" rel="noopener noreferrer">Live</a>
            <a href="/newsletter/">Newsletter</a>
            <a href="/categories/">Topics</a>
        </nav>

        <div class="gec-header-actions">
            {{ partial "search.html" . }}

            <button
                type="button"
                class="theme-toggle gec-icon-button"
                id="theme-toggle"
                aria-label="Switch to light mode"
                aria-pressed="false"
                title="Dark mode"
            >
                <svg class="theme-toggle-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                    <g class="theme-icon-sun">
                        <circle cx="12" cy="12" r="4.25"></circle>
                        <path d="M12 2V4"></path>
                        <path d="M12 20V22"></path>
                        <path d="M2 12H4"></path>
                        <path d="M20 12H22"></path>
                        <path d="M4.93 4.93L6.34 6.34"></path>
                        <path d="M17.66 17.66L19.07 19.07"></path>
                        <path d="M17.66 6.34L19.07 4.93"></path>
                        <path d="M4.93 19.07L6.34 17.66"></path>
                    </g>
                    <g class="theme-icon-moon">
                        <path d="M20.25 15.25A8.5 8.5 0 0 1 8.75 3.75 8.5 8.5 0 1 0 20.25 15.25Z"></path>
                    </g>
                </svg>
                <span class="sr-only">Toggle colour theme</span>
            </button>

            <a class="gec-icon-button" href="https://www.youtube.com/@GamingEvolutionCentre" target="_blank" rel="noopener noreferrer" aria-label="Gaming Evolution Centre on YouTube" title="YouTube">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2a2.9 2.9 0 0 0-2-2C17.8 4.7 12 4.7 12 4.7s-5.8 0-7.6.5a2.9 2.9 0 0 0-2 2A30 30 0 0 0 2 12a30 30 0 0 0 .4 4.8 2.9 2.9 0 0 0 2 2c1.8.5 7.6.5 7.6.5s5.8 0 7.6-.5a2.9 2.9 0 0 0 2-2A30 30 0 0 0 22 12a30 30 0 0 0-.4-4.8ZM10 15.2V8.8l5.5 3.2-5.5 3.2Z"/></svg>
            </a>

            <a class="gec-icon-button" href="https://github.com/GamingEvolutionCentre" target="_blank" rel="noopener noreferrer" aria-label="Gaming Evolution Centre on GitHub" title="GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8A11.4 11.4 0 0 0 8.4 23c.6.1.8-.3.8-.6v-2.2c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.4-5.5-6A4.7 4.7 0 0 1 4.8 7.7a4.4 4.4 0 0 1 .1-3.2s1-.3 3.6 1.2a12.4 12.4 0 0 1 6.6 0c2.5-1.5 3.6-1.2 3.6-1.2a4.4 4.4 0 0 1 .1 3.2 4.7 4.7 0 0 1 1.2 3.2c0 4.6-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.4 11.4 0 0 0 12 .8Z"/></svg>
            </a>
        </div>
    </div>
</header>
