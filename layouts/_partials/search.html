<div
    class="site-search"
    id="site-search"
>
    <form
        class="header-search-bar"
        id="site-search-form"
        role="search"
        autocomplete="off"
    >
        <label class="sr-only" for="search-input">
            Search articles
        </label>

        <svg
            class="header-search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
        >
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16 16L21 21"></path>
        </svg>

        <input
            type="search"
            id="search-input"
            class="header-search-input"
            placeholder="Search articles..."
            autocomplete="off"
            spellcheck="false"
            aria-controls="search-inline-panel"
            aria-expanded="false"
        >
    </form>

    <div
        class="search-inline-panel"
        id="search-inline-panel"
        hidden
    >
        <p
            class="search-count"
            id="search-summary"
            aria-live="polite"
        >
            Enter a search term.
        </p>

        <div
            class="search-results"
            id="search-results"
        ></div>
    </div>
</div>
