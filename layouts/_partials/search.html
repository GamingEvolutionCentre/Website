<div
    class="site-search"
    id="site-search"
>
    <form
        class="header-search-bar"
        id="site-search-form"
        role="search"
        autocomplete="off"
    >
        <label class="sr-only" for="search-input">
            Search articles
        </label>

        <input
            type="search"
            id="search-input"
            class="header-search-input"
            placeholder="Search articles..."
            autocomplete="off"
            spellcheck="false"
            aria-controls="search-inline-panel"
            aria-expanded="false"
        >

        <span
            aria-hidden="true"
            style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;min-width:28px;flex:0 0 28px;margin:0;padding:0;background:transparent;border:0;box-shadow:none;color:#000000;"
        >
            <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="#000000"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                focusable="false"
                style="display:block;width:18px;height:18px;fill:none;stroke:#000000;color:#000000;pointer-events:none;"
            >
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="M16 16L21 21"></path>
            </svg>

            <button
                type="submit"
                aria-label="Search"
                title="Search"
                style="position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;border:0;background:transparent;cursor:pointer;"
            ></button>
        </span>
    </form>

    <div
        class="search-inline-panel"
        id="search-inline-panel"
        hidden
    >
        <p
            class="search-count"
            id="search-summary"
            aria-live="polite"
        >
            Enter a search term.
        </p>

        <div
            class="search-results"
            id="search-results"
        ></div>
    </div>
</div>
