<div class="support-form-wrapper" id="support-form-wrapper">
    <form class="support-form" id="support-form" action="/api/support" method="post">
        <p class="support-required-note">
            Fields marked with <strong>*</strong> are required. All required fields must be completed before your support request can be submitted.
        </p>

        <div class="support-field">
            <label for="support-name">Name <span aria-hidden="true">*</span></label>
            <input
                type="text"
                id="support-name"
                name="name"
                autocomplete="name"
                maxlength="100"
                required
            >
        </div>

        <div class="support-field">
            <label for="support-email">Email address to contact you on <span aria-hidden="true">*</span></label>
            <input
                type="email"
                id="support-email"
                name="email"
                autocomplete="email"
                maxlength="254"
                required
            >
        </div>

        <div class="support-field">
            <label for="support-message">Complaint or help needed <span aria-hidden="true">*</span></label>
            <textarea
                id="support-message"
                name="message"
                rows="8"
                maxlength="5000"
                required
            ></textarea>
        </div>

        <div class="support-honeypot" aria-hidden="true">
            <label for="support-website">Website</label>
            <input
                type="text"
                id="support-website"
                name="website"
                tabindex="-1"
                autocomplete="off"
            >
        </div>

        <button class="support-submit" type="submit">Submit</button>

        <p
            class="support-form-status"
            id="support-form-status"
            role="status"
            aria-live="polite"
        ></p>
    </form>

    <section
        class="support-success-message"
        id="support-success-message"
        role="status"
        aria-live="polite"
        hidden
        style="width:100%;max-width:1000px;margin:auto;text-align:center;box-sizing:border-box;padding:40px 24px;"
    >
        <h2
            tabindex="-1"
            style="margin:0 0 28px;font-size:clamp(3rem,8vw,6rem);font-weight:900;line-height:1.02;letter-spacing:-0.03em;text-align:center;color:var(--gec-text);"
        >Thank you for your submission</h2>
        <p
            style="margin:0 auto;max-width:760px;font-size:clamp(1.1rem,2.5vw,1.5rem);line-height:1.6;text-align:center;color:var(--gec-text);"
        >Check your inbox or junk for the automated email with details.</p>
    </section>
</div>

<script>
(() => {
    const form = document.getElementById("support-form");
    const status = document.getElementById("support-form-status");
    const successMessage = document.getElementById("support-success-message");
    const mainContent = document.getElementById("main-content");

    if (!form || !status || !successMessage || !mainContent) {
        return;
    }

    const submitButton = form.querySelector(".support-submit");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!form.reportValidity()) {
            status.className = "support-form-status is-error";
            status.textContent = "Please complete all required fields before submitting your support request.";
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Sending...";
        status.className = "support-form-status";
        status.textContent = "Sending your support request...";

        try {
            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());

            const response = await fetch(form.action, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
                body: JSON.stringify(payload),
            });

            const result = await response.json().catch(() => ({}));

            if (!response.ok || !result.success) {
                throw new Error(
                    result.message ||
                    "Your support request could not be sent. Please try again."
                );
            }

            successMessage.hidden = false;
            mainContent.replaceChildren(successMessage);

            mainContent.style.width = "100%";
            mainContent.style.minHeight = "calc(100vh - 80px)";
            mainContent.style.display = "flex";
            mainContent.style.alignItems = "center";
            mainContent.style.justifyContent = "center";
            mainContent.style.boxSizing = "border-box";
            mainContent.style.padding = "48px 24px";
            mainContent.style.textAlign = "center";

            window.scrollTo({ top: 0, behavior: "smooth" });

            const heading = successMessage.querySelector("h2");
            if (heading) {
                heading.focus({ preventScroll: true });
            }
        } catch (error) {
            status.className = "support-form-status is-error";
            status.textContent =
                error.message ||
                "Your support request could not be sent. Please try again.";
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Submit";
        }
    });
})();
</script>
