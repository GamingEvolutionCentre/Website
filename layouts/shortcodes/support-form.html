<form class="support-form" action="mailto:support@gamingevolutioncentre.co.uk" method="post" enctype="text/plain">
    <div class="support-field">
        <label for="support-name">Name</label>
        <input
            type="text"
            id="support-name"
            name="Name"
            autocomplete="name"
            required
        >
    </div>

    <div class="support-field">
        <label for="support-email">Email address to contact you on</label>
        <input
            type="email"
            id="support-email"
            name="Contact Email"
            autocomplete="email"
            required
        >
    </div>

    <div class="support-field">
        <label for="support-message">Complaint or help needed</label>
        <textarea
            id="support-message"
            name="Complaint or Help Needed"
            rows="8"
            required
        ></textarea>
    </div>

    <button class="support-submit" type="submit">Submit</button>
</form>
