<!DOCTYPE html>

<html
    lang="{{ site.Language.Locale | default "en-GB" }}"
    data-site-style="modern"
    data-theme="dark"
>
<head>

    <!--
        Restore both independent preferences before CSS renders:
        - Site style: Modern / Old
        - Colour theme: Light / Dark
    -->
    <script>
        (() => {
            const styleKey = "gec-site-style";
            const themeKey = "gec-theme";

            let siteStyle = "modern";
            let theme = "dark";

            try {
                const savedStyle = localStorage.getItem(styleKey);
                const savedTheme = localStorage.getItem(themeKey);

                if (
                    savedStyle === "modern" ||
                    savedStyle === "old"
                ) {
                    siteStyle = savedStyle;
                }

                if (
                    savedTheme === "light" ||
                    savedTheme === "dark"
                ) {
                    theme = savedTheme;
                }
            } catch (_) {}

            document.documentElement.dataset.siteStyle =
                siteStyle;

            document.documentElement.dataset.theme =
                theme;
        })();
    </script>

    {{ partial "head.html" . }}

</head>

<body>

    {{ partial "site-style-switcher.html" . }}

    {{ partial "header.html" . }}

    <main
        id="main-content"
        data-pagefind-body
    >
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    {{ partial "search.html" . }}

    {{ partial "scripts.html" . }}

</body>
</html>
