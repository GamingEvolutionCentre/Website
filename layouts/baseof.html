<!DOCTYPE html>

<html
    lang="{{ site.Language.Locale | default "en-GB" }}"
    data-theme="dark"
>
<head>

    <!-- Restore Light/Dark before CSS renders to prevent flashing. -->
    <script>
        (() => {
            const storageKey = "gec-theme";
            let theme = "dark";

            try {
                const saved = localStorage.getItem(storageKey);

                if (
                    saved === "light" ||
                    saved === "dark"
                ) {
                    theme = saved;
                }
            } catch (_) {}

            document.documentElement.dataset.theme = theme;
        })();
    </script>

    {{ partial "head.html" . }}

</head>

<body>

    {{ partial "header.html" . }}

    <main
        id="main-content"
        data-pagefind-body
    >
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}\n    {{ partial "scripts.html" . }}

</body>
</html>
